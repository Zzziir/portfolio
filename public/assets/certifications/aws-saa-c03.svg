<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AWS SAA-C03 badge placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1a16"/>
      <stop offset="1" stop-color="#121010"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="239" height="239" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- ribbon tails -->
  <path d="M104 150 L92 206 L118 190 L120 158 Z" fill="#f59e0b" fill-opacity="0.85"/>
  <path d="M136 150 L148 206 L122 190 L120 158 Z" fill="#b45309" fill-opacity="0.9"/>

  <!-- medal -->
  <circle cx="120" cy="104" r="52" fill="#17150f" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="120" cy="104" r="40" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>

  <text x="120" y="98" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#f59e0b" fill-opacity="0.9">AWS</text>
  <text x="120" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="18" fill="#f4efe6">SAA-C03</text>

  <text x="120" y="226" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="2" fill="#ffffff" fill-opacity="0.35">BADGE PLACEHOLDER</text>
</svg>
